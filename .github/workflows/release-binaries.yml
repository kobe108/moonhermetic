name: Release binaries

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v5

      - name: Set up MoonBit
        uses: hustcer/setup-moonbit@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update MoonBit registry
        run: moon update

      - name: Build release binary
        run: moon build cmd/main --target native --release

      - name: Package release binary
        run: node scripts/package-binary.mjs

      - name: Verify packaged binary
        shell: bash
        run: |
          for binary in dist/*; do
            case "$binary" in
              *.sha256) continue ;;
            esac
            "$binary" --version
          done

      - name: Test action binary planner
        run: node --test tests/action-binary.test.mjs tests/action-runner.test.mjs

      - name: Upload release candidate
        uses: actions/upload-artifact@v5
        with:
          name: release-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Verify checksums
        shell: bash
        run: |
          cd dist
          for checksum in *.sha256; do
            sha256sum -c "$checksum"
          done

      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --generate-notes \
              --title "MoonHermetic $RELEASE_TAG"
          fi
