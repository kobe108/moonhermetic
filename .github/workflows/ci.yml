name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v5

      - name: Set up MoonBit
        uses: hustcer/setup-moonbit@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update dependency index
        run: |
          moon version --all
          moon update

      - name: Check
        run: moon check

      - name: Test
        run: moon test

      - name: Hermeticity audit
        shell: pwsh
        run: |
          moon run cmd/main -- . --exclude examples --format sarif --fail-on error | Out-File -Encoding utf8 moonhermetic.sarif

      - name: Upload SARIF
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: moonhermetic-${{ matrix.os }}
          path: moonhermetic.sarif
