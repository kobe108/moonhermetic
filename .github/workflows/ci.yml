name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v5

      - name: Set up MoonBit
        uses: hustcer/setup-moonbit@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update dependency index
        run: |
          moon version --all
          moon update

      - name: Check
        run: moon check --target all --deny-warn

      - name: Test
        run: moon test --target all --deny-warn

      - name: Hermeticity audit
        shell: pwsh
        run: |
          moon run cmd/main -- . --exclude examples --format sarif --fail-on error | Out-File -Encoding utf8 moonhermetic.sarif

      - name: Cross-file semantic contract
        shell: bash
        run: |
          moon run cmd/main -- examples/semantic/cross_file \
            --no-config --format json --fail-on never > cross-file.json
          node -e 'const fs=require("node:fs"); const r=JSON.parse(fs.readFileSync("cross-file.json","utf8")); const f=r.findings[0]; if (!f || !f.path.endsWith("request.mbt") || f.callPath.join(" -> ") !== "cross-file request reads an ambient token -> prepare_request -> read_ambient_token") process.exit(1)'

      - name: Suppression governance
        run: moon run cmd/main -- . --exclude examples --fail-on-suppression

      - name: Upload SARIF
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: moonhermetic-${{ matrix.os }}
          path: moonhermetic.sarif

  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v5

      - name: Set up MoonBit
        uses: hustcer/setup-moonbit@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update dependency index
        run: moon update

      - name: Run acceptance script
        run: pwsh scripts/verify-acceptance.ps1
