name: Reusable Action

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v5

      - name: Test release tooling
        run: >-
          node --test
          tests/action-binary.test.mjs
          tests/action-runner.test.mjs
          tests/github-report.test.mjs
          tests/package.test.mjs

      - name: Run the reusable action
        id: moonhermetic
        uses: ./
        with:
          path: examples/safe
          format: text
          fail-on: warning
          baseline: examples/safe-baseline.json
          output-file: ${{ runner.temp }}/moonhermetic-action.txt

      - name: Verify generated summary
        shell: bash
        env:
          SUMMARY_PATH: ${{ steps.moonhermetic.outputs.summary-path }}
        run: |
          node -e 'const fs = require("node:fs"); const text = fs.readFileSync(process.env.SUMMARY_PATH, "utf8"); if (!text.includes("# MoonHermetic report")) process.exit(1)'

      - name: Verify the action report
        shell: bash
        env:
          REPORT_PATH: ${{ steps.moonhermetic.outputs.report-path }}
        run: |
          node -e 'const fs = require("node:fs"); const report = process.env.REPORT_PATH; if (!fs.existsSync(report) || !fs.readFileSync(report, "utf8").includes("0 finding(s)")) process.exit(1)'

  governance-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - name: Set up MoonBit for init smoke
        uses: hustcer/setup-moonbit@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update MoonBit registry for init smoke
        run: moon update

      - name: Test init flow
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "moonhermetic-init"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item examples/risky/checkout_test.mbt `
            (Join-Path $dir "risky_test.mbt")
          moon run cmd/main -- init $dir `
            --config (Join-Path $dir "moonhermetic.json") `
            --baseline (Join-Path $dir "baseline.json")
          $baseline = Get-Content (Join-Path $dir "baseline.json") -Raw |
            ConvertFrom-Json
          if ($baseline.findings.Count -ne 3) {
            throw "expected three baseline entries"
          }
          moon run cmd/main -- doctor $dir `
            --config (Join-Path $dir "moonhermetic.json") `
            --baseline (Join-Path $dir "baseline.json") `
            --strict

      - name: Audit suppressions
        uses: ./
        with:
          path: examples/suppressions
          audit-suppressions: true
          output-file: ${{ runner.temp }}/moonhermetic-suppressions.json

      - name: Reject expired suppressions
        id: expected-failure
        continue-on-error: true
        uses: ./
        with:
          path: examples/suppressions
          fail-on-suppression: true
          output-file: ${{ runner.temp }}/moonhermetic-suppressions-gated.json

      - name: Assert the governance gate failed
        if: steps.expected-failure.outcome != 'failure'
        shell: bash
        run: |
          echo "Expected the expired suppression to fail the action." >&2
          exit 1
