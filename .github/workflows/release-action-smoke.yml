name: Release action smoke

# Update the pinned tag when validating a newer release.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v5

      - name: Run released action
        id: moonhermetic
        uses: kobe108/moonhermetic@v0.16.1
        with:
          path: examples/safe
          format: text
          baseline: examples/safe-baseline.json
          output-file: ${{ runner.temp }}/moonhermetic-release.txt

      - name: Verify binary execution and report
        shell: bash
        env:
          EXECUTION_MODE: ${{ steps.moonhermetic.outputs.execution-mode }}
          REPORT_PATH: ${{ steps.moonhermetic.outputs.report-path }}
        run: |
          test "$EXECUTION_MODE" = "binary"
          node -e 'const fs = require("node:fs"); const report = process.env.REPORT_PATH; if (!fs.existsSync(report) || !fs.readFileSync(report, "utf8").includes("0 finding(s)")) process.exit(1)'

      - name: Run released cross-file scan
        id: crossfile
        uses: kobe108/moonhermetic@v0.16.1
        with:
          path: examples/semantic/cross_file
          format: json
          fail-on: never
          output-file: ${{ runner.temp }}/moonhermetic-release-cross-file.json

      - name: Verify released cross-file contract
        shell: bash
        env:
          EXECUTION_MODE: ${{ steps.crossfile.outputs.execution-mode }}
          REPORT_PATH: ${{ steps.crossfile.outputs.report-path }}
        run: |
          test "$EXECUTION_MODE" = "binary"
          node -e 'const fs=require("node:fs"); const r=JSON.parse(fs.readFileSync(process.env.REPORT_PATH,"utf8")); const f=r.findings[0]; const expected="cross-file request reads an ambient token -> prepare_request -> read_ambient_token"; if (!f || f.callPath.join(" -> ")!==expected) process.exit(1)'
