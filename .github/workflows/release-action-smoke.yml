name: Release action smoke

# Update the pinned tag when validating a newer release.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v5

      - name: Run released action
        id: moonhermetic
        uses: kobe108/moonhermetic@v0.11.0
        with:
          path: examples/safe
          format: text
          output-file: ${{ runner.temp }}/moonhermetic-release.txt

      - name: Verify binary execution and report
        shell: bash
        env:
          EXECUTION_MODE: ${{ steps.moonhermetic.outputs.execution-mode }}
          REPORT_PATH: ${{ steps.moonhermetic.outputs.report-path }}
        run: |
          test "$EXECUTION_MODE" = "binary"
          node -e 'const fs = require("node:fs"); const report = process.env.REPORT_PATH; if (!fs.existsSync(report) || !fs.readFileSync(report, "utf8").includes("0 finding(s)")) process.exit(1)'
