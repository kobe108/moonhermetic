name: Precision benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: Set up MoonBit
        uses: hustcer/setup-moonbit@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update dependency index
        run: |
          moon version --all
          moon update

      - name: Run precision benchmark
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pwsh scripts/run-precision.ps1 -WorkDir .precision-benchmark
